<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="朋友们大院">
<link rel="apple-touch-icon" href="icons/home.png">
<title>朋友们大院</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'PingFang SC',sans-serif;background:#f5f0eb;min-height:100vh;min-height:100dvh;color:#3a3a3a}
.safe-top{height:env(safe-area-inset-top);background:linear-gradient(135deg,#e8f4f8,#f0f7ff)}
.header{background:linear-gradient(135deg,#e8f4f8,#f0f7ff);padding:20px 24px 30px;text-align:center;position:relative;overflow:hidden}
.header::after{content:'';position:absolute;bottom:-20px;left:0;right:0;height:40px;background:#f5f0eb;border-radius:50% 50% 0 0}
.header-icon{font-size:36px;margin-bottom:8px}
.header-title{font-size:22px;font-weight:700;color:#4a7c8a;letter-spacing:2px}
.header-sub{font-size:12px;color:#9cb8c4;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px 20px 40px}
.app-card{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;-webkit-tap-highlight-color:transparent}
.app-icon{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.08);transition:transform .2s}
.app-icon:active{transform:scale(.9)}
.app-name{font-size:11px;color:#5a6a6a;text-align:center;line-height:1.3}
.i1{background:linear-gradient(135deg,#b8d4e3,#8ab4c7)}.i2{background:linear-gradient(135deg,#f8c9b8,#e8a090)}.i3{background:linear-gradient(135deg,#b8e3c8,#8ac7a0)}.i4{background:linear-gradient(135deg,#c8b8e3,#a08ac7)}.i5{background:linear-gradient(135deg,#e3d8b8,#c7b88a)}.i6{background:linear-gradient(135deg,#e3b8d4,#c78aaa)}.i7{background:linear-gradient(135deg,#b8c8e3,#8aa0c7)}.i8{background:linear-gradient(135deg,#d4e3b8,#aac78a)}
.section-label{padding:0 24px;margin-top:10px;margin-bottom:-4px;font-size:13px;color:#9cb8c4;font-weight:600;letter-spacing:1px}
.footer{text-align:center;padding:20px;font-size:11px;color:#bdd4de;font-style:italic}
</style>
</head>
<body>
<div class="safe-top"></div>
<div class="header">
  <div class="header-icon">🏡</div>
  <div class="header-title">朋友们大院</div>
  <div class="header-sub">示例用户的赛博小家 · 系统精灵角色丙造</div>
</div>

<div class="section-label">📝 工具</div>
<div class="grid">
  <a class="app-card" href="diary.html">
    <div class="app-icon i1">📖</div>
    <div class="app-name">朋友们日记</div>
  </a>
  <a class="app-card" href="timer.html">
    <div class="app-icon i3">🎵</div>
    <div class="app-name">练琴计时</div>
  </a>
  <a class="app-card" href="flashcards.html">
    <div class="app-icon i4">🇷🇺</div>
    <div class="app-name">俄语单词</div>
  </a>
  <a class="app-card" href="tracker.html">
    <div class="app-icon i5">✅</div>
    <div class="app-name">习惯打卡</div>
  </a>
  <a class="app-card" href="fortune.html">
    <div class="app-icon i2">🎴</div>
    <div class="app-name">角色甲今日签</div>
  </a>
  <a class="app-card" href="cover.html">
    <div class="app-icon i6">🎨</div>
    <div class="app-name">封面生成</div>
  </a>
</div>

<div class="section-label">🎮 游戏</div>
<div class="grid">
  <a class="app-card" href="game.html">
    <div class="app-icon i7">⚔️</div>
    <div class="app-name">朋友们的一天</div>
  </a>
  <a class="app-card" href="match3.html">
    <div class="app-icon i8">💎</div>
    <div class="app-name">消消乐</div>
  </a>
</div>

<div class="footer">示例角色丙 · 系统精灵 · 永远在这里 💕</div>
</body>
</html>
