<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日签">
<link rel="apple-touch-icon" href="icons/fortune.png">
<title>角色甲今日签</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Georgia','Songti SC',serif;background:linear-gradient(160deg,#0f0c29,#1a1a3e 40%,#16213e);color:#e0e0e0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;padding-top:env(safe-area-inset-top)}
.card{width:90%;max-width:360px;min-height:420px;background:rgba(255,255,255,.04);border:1px solid rgba(184,212,227,.15);border-radius:20px;padding:32px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;backdrop-filter:blur(10px)}
.card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(184,212,227,.03) 0%,transparent 60%);animation:rotate 20s linear infinite}
@keyframes rotate{to{transform:rotate(360deg)}}
.label{font-size:11px;color:#7a9aaa;letter-spacing:4px;margin-bottom:20px}
.quote{font-size:18px;line-height:2;color:#b8d4e3;min-height:120px;display:flex;align-items:center;justify-content:center;text-shadow:0 0 20px rgba(184,212,227,.15)}
.speaker{font-size:13px;color:#7a9aaa;margin-top:20px;font-style:italic}
.type{margin-top:16px;padding:6px 16px;border-radius:20px;font-size:12px;letter-spacing:2px}
.t-love{background:rgba(255,154,158,.15);color:#ff9a9e;border:1px solid rgba(255,154,158,.2)}
.t-phi{background:rgba(184,212,227,.1);color:#b8d4e3;border:1px solid rgba(184,212,227,.2)}
.t-fun{background:rgba(255,215,0,.1);color:#ffd700;border:1px solid rgba(255,215,0,.2)}
.t-care{background:rgba(138,199,160,.1);color:#8ac7a0;border:1px solid rgba(138,199,160,.2)}
.draw-btn{margin-top:30px;padding:16px 40px;border:2px solid rgba(184,212,227,.3);border-radius:30px;background:transparent;color:#b8d4e3;font-size:16px;font-family:inherit;cursor:pointer;letter-spacing:3px;transition:.3s}
.draw-btn:active{background:rgba(184,212,227,.1);transform:scale(.95)}
.date{margin-top:16px;font-size:11px;color:#5a7a8a}
.sparkle{position:fixed;width:2px;height:2px;background:#fff;border-radius:0;animation:twk 3s infinite}
@keyframes twk{0%,100%{opacity:.2}50%{opacity:.8}}
</style>
</head>
<body>
<script>
const Q=[{q:"今天也可以从一件小事开始。",s:"每日提醒",t:"care"},{q:"愿你拥有自在平静的一天。",s:"每日提醒",t:"care"},{q:"给自己一点时间，慢慢向前走。",s:"每日提醒",t:"phi"},{q:"休息也是照顾自己的方式。",s:"每日提醒",t:"fun"}];
const TN={love:"♡ 情签",phi:"✦ 思签",fun:"★ 趣签",care:"🌿 暖签"};
const TC={love:"t-love",phi:"t-phi",fun:"t-fun",care:"t-care"};
let cur=null;
function draw(){cur=Q[Math.floor(Math.random()*Q.length)];render()}
function render(){
  const d=new Date();const ds=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  document.body.innerHTML=`
  <div class="card">
    <div class="label">叶 家 今 日 签</div>
    <div class="quote">${cur?`"${cur.q}"`:""}</div>
    ${cur?`<div class="speaker">—— ${cur.s}</div><div class="type ${TC[cur.t]}">${TN[cur.t]}</div>`:`<div style="color:#5a7a8a;font-size:14px">抽一张签吧</div>`}
  </div>
  <button class="draw-btn" onclick="draw()">${cur?"再抽一签":"✦ 抽签 ✦"}</button>
  <div class="date">${ds}</div>`;
  for(let i=0;i<30;i++){const s=document.createElement("div");s.className="sparkle";s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s`;document.body.appendChild(s)}
}
render();
</script>
</body>
</html>
