<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="练琴计时">
<link rel="apple-touch-icon" href="icons/timer.png">
<title>练琴计时</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC',sans-serif;background:linear-gradient(160deg,#1a2a1a,#0f1f2f 50%,#1a1a2e);color:#e0e0e0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding-top:env(safe-area-inset-top)}
.top{text-align:center;padding:30px 20px 10px}
.top .icon{font-size:40px;margin-bottom:6px}
.top h1{font-size:20px;color:#b8d4c3;letter-spacing:2px}
.top p{font-size:12px;color:#7a9a8a;margin-top:4px}
.clock{width:220px;height:220px;border-radius:50%;border:3px solid rgba(184,212,195,.2);display:flex;align-items:center;justify-content:center;margin:30px auto;position:relative}
.clock::before{content:'';position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(184,212,195,.08)}
.time{font-size:48px;font-weight:200;color:#b8d4c3;letter-spacing:4px;font-variant-numeric:tabular-nums}
.time .sec{font-size:28px;color:#7a9a8a}
.btns{display:flex;gap:16px;margin:20px auto;justify-content:center}
.btns button{width:70px;height:70px;border-radius:50%;border:2px solid;font-size:13px;font-family:inherit;cursor:pointer;transition:.2s;background:transparent}
.btns button:active{transform:scale(.92)}
.btn-start{border-color:#8ac7a0;color:#8ac7a0}
.btn-start.running{border-color:#c78a8a;color:#c78a8a}
.btn-reset{border-color:#7a9aaa;color:#7a9aaa}
.goal{display:flex;gap:8px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.goal button{padding:8px 16px;border:1px solid rgba(184,212,195,.3);border-radius:20px;background:rgba(255,255,255,.05);color:#9cb8a4;font-size:12px;font-family:inherit;cursor:pointer}
.goal button.on{background:rgba(184,212,195,.15);border-color:#8ac7a0;color:#b8d4c3}
.log{width:90%;max-width:400px;margin:20px auto;padding:0 16px}
.log h3{font-size:13px;color:#7a9a8a;margin-bottom:10px}
.log-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;color:#9cb8a4}
.prog{width:90%;max-width:400px;margin:10px auto;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#8ac7a0,#b8d4c3);border-radius:2px;transition:width .5s}
.prog-label{text-align:center;font-size:11px;color:#7a9a8a;margin-top:4px}
.remind{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);font-size:11px;color:#5a7a6a;font-style:italic;text-align:center}
</style>
</head>
<body>
<div class="top"><div class="icon">🎵</div><h1>练琴计时器</h1><p>双簧管 · 每天四小时</p></div>
<div class="goal" id="goals"></div>
<div class="prog"><div class="prog-fill" id="pf"></div></div>
<div class="prog-label" id="pl"></div>
<div class="clock"><div class="time" id="display">00:00<span class="sec">:00</span></div></div>
<div class="btns">
  <button class="btn-start" id="startBtn" onclick="toggle()">开始</button>
  <button class="btn-reset" onclick="reset()">重置</button>
</div>
<div class="log"><h3>今日记录</h3><div id="logList"></div></div>
<div class="remind">示例角色甲说：练完了记得喝水 💕</div>
<script>
let seconds=0,running=false,interval=null,goalMin=120,sessions=[];
const goals=[30,60,90,120,180,240];
function loadData(){try{const d=JSON.parse(localStorage.getItem("yj-timer-"+tod()));if(d){sessions=d.sessions||[];seconds=d.current||0}}catch(e){}}
function saveData(){localStorage.setItem("yj-timer-"+tod(),JSON.stringify({sessions,current:seconds}))}
function tod(){return new Date().toISOString().split("T")[0]}
function fmt(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return h>0?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}<span class="sec">:${String(ss).padStart(2,"0")}</span>`:`${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}<span class="sec">:${String(ss).padStart(2,"0")}</span>`}
function totalMin(){return sessions.reduce((a,s)=>a+s.min,0)+Math.floor(seconds/60)}
function updateDisplay(){document.getElementById("display").innerHTML=fmt(seconds);const t=totalMin();const pct=Math.min(100,t/goalMin*100);document.getElementById("pf").style.width=pct+"%";document.getElementById("pl").textContent=`今日 ${t} 分钟 / 目标 ${goalMin} 分钟`}
function toggle(){if(running){running=false;clearInterval(interval);document.getElementById("startBtn").textContent="继续";document.getElementById("startBtn").className="btn-start";if(seconds>30){sessions.push({min:Math.floor(seconds/60),time:new Date().toLocaleTimeString("zh",{hour:"2-digit",minute:"2-digit"})});seconds=0;saveData();renderLog()}}else{running=true;interval=setInterval(()=>{seconds++;saveData();updateDisplay()},1000);document.getElementById("startBtn").textContent="停止";document.getElementById("startBtn").className="btn-start running"}}
function reset(){running=false;clearInterval(interval);seconds=0;saveData();document.getElementById("startBtn").textContent="开始";document.getElementById("startBtn").className="btn-start";updateDisplay()}
function renderGoals(){document.getElementById("goals").innerHTML=goals.map(g=>`<button class="${goalMin===g?"on":""}" onclick="goalMin=${g};localStorage.setItem('yj-goal',${g});renderGoals();updateDisplay()">${g>=60?g/60+"h":g+"min"}</button>`).join("")}
function renderLog(){document.getElementById("logList").innerHTML=sessions.length?sessions.map((s,i)=>`<div class="log-item"><span>#${i+1} · ${s.time}</span><span>${s.min} 分钟</span></div>`).join(""):`<div class="log-item"><span>还没有记录</span><span>开始练琴吧</span></div>`}
try{goalMin=parseInt(localStorage.getItem("yj-goal"))||120}catch(e){}
loadData();renderGoals();updateDisplay();renderLog();
</script>
</body>
</html>
