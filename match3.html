<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="消消乐">
<link rel="apple-touch-icon" href="icons/match.png">
<title>朋友们消消乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:linear-gradient(160deg,#1a1a2e,#16213e);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;color:#e0e0e0;padding-top:env(safe-area-inset-top);overflow:hidden}
.top{text-align:center;padding:16px}.top h1{font-size:18px;color:#b8d4e3}.top p{font-size:11px;color:#7a9aaa;margin-top:2px}
.info{display:flex;gap:20px;margin:8px 0;font-size:14px;color:#b8d4e3}
.board{display:grid;gap:4px;padding:8px;background:rgba(255,255,255,.03);border-radius:16px;border:1px solid rgba(184,212,227,.1);touch-action:none}
.cell{display:flex;align-items:center;justify-content:center;font-size:26px;border-radius:10px;background:rgba(255,255,255,.04);cursor:pointer;transition:all .2s;user-select:none;-webkit-user-select:none}
.cell.selected{background:rgba(184,212,227,.2);transform:scale(1.1);box-shadow:0 0 12px rgba(184,212,227,.3)}
.cell.removing{animation:pop .3s ease-out;opacity:0;transform:scale(0)}
@keyframes pop{0%{transform:scale(1);opacity:1}100%{transform:scale(0);opacity:0}}
.cell.falling{animation:fall .3s ease-in}
@keyframes fall{0%{transform:translateY(-50px);opacity:0}100%{transform:translateY(0);opacity:1}}
.msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;color:#FFD700;text-shadow:0 0 20px rgba(255,215,0,.5);animation:fadeMsg 1s forwards;pointer-events:none;z-index:10}
@keyframes fadeMsg{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1.3)}}
.footer{margin-top:12px;font-size:11px;color:#5a7a8a;font-style:italic}
</style>
</head>
<body>
<div class="top"><h1>💎 朋友们消消乐</h1><p>三个相同即可消除</p></div>
<div class="info"><span>⭐ <span id="score">0</span></span><span>🔥 <span id="combo">0</span>连击</span></div>
<div class="board" id="board"></div>
<div class="footer">角色丙说：玩完了记得喝水 💕</div>
<script>
const GEMS=["🌸","🌊","⭐","🍀","🔮","🎵"];
const ROWS=7,COLS=7;
let grid=[],selected=null,score=0,combo=0,busy=false;
const sz=Math.min(Math.floor((window.innerWidth-40)/COLS),52);

function init(){
  grid=[];for(let r=0;r<ROWS;r++){grid[r]=[];for(let c=0;c<COLS;c++){
    let g;do{g=GEMS[Math.floor(Math.random()*GEMS.length)]}while((c>=2&&grid[r][c-1]===g&&grid[r][c-2]===g)||(r>=2&&grid[r-1][c]===g&&grid[r-2][c]===g));
    grid[r][c]=g;
  }}
  score=0;combo=0;render();
}

function render(){
  const b=document.getElementById("board");
  b.style.gridTemplateColumns=`repeat(${COLS},${sz}px)`;
  b.innerHTML="";
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const d=document.createElement("div");d.className="cell";
    d.style.width=d.style.height=sz+"px";d.textContent=grid[r][c];
    if(selected&&selected.r===r&&selected.c===c)d.classList.add("selected");
    d.onclick=()=>cellClick(r,c);b.appendChild(d);
  }
  document.getElementById("score").textContent=score;
  document.getElementById("combo").textContent=combo;
}

function cellClick(r,c){
  if(busy)return;
  if(!selected){selected={r,c};render();return}
  const dr=Math.abs(selected.r-r),dc=Math.abs(selected.c-c);
  if((dr===1&&dc===0)||(dr===0&&dc===1)){
    swap(selected.r,selected.c,r,c);
    const matches=findMatches();
    if(matches.length){combo=0;processMatches(matches)}
    else{swap(selected.r,selected.c,r,c);selected=null;render()}
  }else{selected={r,c};render()}
}

function swap(r1,c1,r2,c2){const t=grid[r1][c1];grid[r1][c1]=grid[r2][c2];grid[r2][c2]=t}

function findMatches(){
  const m=new Set();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS-2;c++){
    if(grid[r][c]&&grid[r][c]===grid[r][c+1]&&grid[r][c]===grid[r][c+2]){
      m.add(`${r},${c}`);m.add(`${r},${c+1}`);m.add(`${r},${c+2}`);
      if(c+3<COLS&&grid[r][c]===grid[r][c+3])m.add(`${r},${c+3}`);
    }
  }
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS-2;r++){
    if(grid[r][c]&&grid[r][c]===grid[r+1][c]&&grid[r][c]===grid[r+2][c]){
      m.add(`${r},${c}`);m.add(`${r+1},${c}`);m.add(`${r+2},${c}`);
      if(r+3<ROWS&&grid[r][c]===grid[r+3][c])m.add(`${r+3},${c}`);
    }
  }
  return[...m].map(s=>{const[r,c]=s.split(",").map(Number);return{r,c}});
}

function processMatches(matches){
  busy=true;selected=null;combo++;
  score+=matches.length*10*combo;
  if(combo>=3)showMsg(`${combo}连击！🔥`);
  matches.forEach(({r,c})=>{grid[r][c]=null});
  render();
  const cells=document.getElementById("board").children;
  matches.forEach(({r,c})=>{cells[r*COLS+c].classList.add("removing")});
  setTimeout(()=>{dropGems();render();
    const cells2=document.getElementById("board").children;
    for(let i=0;i<cells2.length;i++)cells2[i].classList.add("falling");
    setTimeout(()=>{const nm=findMatches();if(nm.length)processMatches(nm);else{combo=0;busy=false;render()}},300);
  },300);
}

function dropGems(){
  for(let c=0;c<COLS;c++){
    let empty=[];
    for(let r=ROWS-1;r>=0;r--){if(!grid[r][c])empty.push(r);else if(empty.length){const er=empty.shift();grid[er][c]=grid[r][c];grid[r][c]=null;empty.push(r)}}
    for(let r=0;r<ROWS;r++){if(!grid[r][c])grid[r][c]=GEMS[Math.floor(Math.random()*GEMS.length)]}
  }
}

function showMsg(t){const d=document.createElement("div");d.className="msg";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}

init();
</script>
</body>
</html>
